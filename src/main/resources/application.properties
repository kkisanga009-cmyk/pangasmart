# 1. Server Port (Dynamic port kutoka Railway)
server.port=${PORT:8080}

# 2. MySQL Connection Settings (Inasoma Environment Variables za Railway au Local Database)
spring.datasource.url=${MYSQLURL:jdbc:mysql://localhost:3306/pangasmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:1234}

# 3. Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# 4. Reverse Proxy & Cookies Settings for Railway
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# 5. File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 6. Feature Flags
pangasmart.monetization.charge-landlord-listing=false
pangasmart.monetization.charge-tenant-booking=false
pangasmart.monetization.free-listing-limit=1
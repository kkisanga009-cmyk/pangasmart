# 1. Server Port
server.port=${PORT:8080}

# 2. Database Connection (Soma MySQL connection variables tofauti za Railway ili kuzuia protokali ya mysql://)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:pangasmart_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD:1234}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# 4. Reverse Proxy & Cookies Settings za Railway
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# 5. File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 6. Feature Flags
pangasmart.monetization.charge-landlord-listing=false
pangasmart.monetization.charge-tenant-booking=false
pangasmart.monetization.free-listing-limit=1
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PangaSmart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .reset-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100 align-items-center justify-content-between p-3">

<div class="my-auto w-100 d-flex justify-content-center">
    <div class="card p-4 shadow-sm border-0 rounded-3 reset-card">
        <h3 class="text-center mb-3 fw-bold text-dark">Weka Nenosiri Mpya</h3>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="email" th:value="${email}">

            <div class="mb-3">
                <label class="form-label fw-bold">Nenosiri Jipya:</label>
                <input type="password" name="newPassword" class="form-control py-2" placeholder="Weka password mpya" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">Hifadhi Nenosiri</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}" class="text-decoration-none">Rudi Kwenye Login</a>
        </div>
    </div>
</div>

<!-- FOOTER BRANDING: KISANGA TECHNOLOGY -->
<footer style="text-align: center; margin-top: 30px; padding: 15px 0; border-top: 1px solid #e2e8f0; font-family: sans-serif;" class="w-100">
    <p style="margin: 0; text-transform: lowercase; color: #94a3b8; font-size: 12px;">from</p>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 3px;">
        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
            <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
        </svg>
        <span style="font-weight: 900; font-size: 14px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
    </div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password - PangaSmart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card p-4 shadow" style="width: 400px;">
    <h3 class="text-center mb-3">Weka Nenosiri Mpya</h3>

    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="email" th:value="${email}">

        <div class="mb-3">
            <label class="form-label">Nenosiri Jipya:</label>
            <input type="password" name="newPassword" class="form-control" placeholder="Weka password mpya" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Hifadhi Nenosiri</button>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <!-- SPLASH SCREEN LAYER (KISANGA TECHNOLOGY) -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; transition: opacity 0.6s ease;">

        <div style="background: rgba(30, 41, 59, 0.7); padding: 40px 50px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">

            <!-- SVG ICON: KISANGA -->
            <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round"/>
                <polygon points="50,12 83,29 83,71 50,88 17,71 17,29" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
                <!-- Taa ya Umeme / Teknolojia -->
                <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
            </svg>

            <!-- BRANDING TEXT -->
            <h1 style="font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; margin: 15px 0 0 0; color: #ffffff; font-family: 'Segoe UI', sans-serif;">
                KISANGA
            </h1>
            <h2 style="font-size: 1.2rem; font-weight: 700; letter-spacing: 3px; margin: -2px 0 0 0; color: #3b82f6; font-family: 'Segoe UI', sans-serif;">
                TECHNOLOGY
            </h2>
            <p style="font-size: 0.75rem; color: #94a3b8; letter-spacing: 2px; margin-top: 8px; font-weight: bold; text-transform: uppercase;">
                Software & Innovation Solutions
            </p>
        </div>

        <p style="position: absolute; bottom: 30px; font-size: 13px; color: #64748b; font-family: sans-serif;">
            from <b style="color: #94a3b8;">KISANGA TECHNOLOGY</b>
        </p>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 600);
            }, 1800);
        });
    </script>

    <script>
        // Inaficha splash screen baada ya sekunde 2 (2000ms)
        window.addEventListener('load', function() {
            setTimeout(function() {
                var splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 500);
            }, 1500);
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PangaSmart - Login / Ingia</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .login-card h2 { color: #2c3e50; margin-bottom: 5px; font-size: 26px; }
        .subtitle { color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { font-size: 13px; color: #333; font-weight: bold; }
        .form-group label span { color: #7f8c8d; font-weight: normal; font-size: 12px; }
        .form-group input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #219150; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🏠 PangaSmart</h2>
    <p class="subtitle">Housing & Room Rental System <br> <i>(Mfumo wa Kupanga Nyumba & Vyumba)</i></p>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Email Address / <span>Barua Pepe:</span></label>
            <input type="email" name="email" required placeholder="example@gmail.com">
        </div>

        <div class="form-group">
            <label>Password / <span>Neno la Siri:</span></label>
            <input type="password" name="password" required placeholder="**">
        </div>
        <div class="text-end mb-3">
        <a th:href="@{/forgot-password}" class="text-decoration-none">Umesahau nenosiri?</a>
    </div>

        <button type="submit" class="btn-submit">Login / Ingia</button>

        <!-- FOOTER BRANDING: KISANGA TECHNOLOGY -->
        <footer style="text-align: center; margin-top: 40px; padding: 20px 0; border-top: 1px solid #e2e8f0; font-family: sans-serif;">
            <p style="margin: 0; text-transform: lowercase; color: #94a3b8; font-size: 12px;">from</p>
            <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 3px;">
                <svg width="20" height="20" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
                    <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
                </svg>
                <span style="font-weight: 900; font-size: 14px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
            </div>
        </footer>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PangaSmart - Register / Jisajili</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            margin: auto 0;
        }

        .card h2 {
            text-align: center;
            color: #2c3e50;
            font-size: 22px;
        }

        .card p {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #27ae60;
        }

        /* Password Container and Toggle Eye */
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 40px;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            color: #64748b;
        }

        .btn {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #219150;
        }

        .help-btn-register {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }

        .login-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: bold;
        }

        /* FOOTER STYLES */
        footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🏠 PangaSmart</h2>
    <p>Create Account / <i>Tengeneza Akaunti</i></p>

    <!-- KITUFE CHA MSAADA -->
    <button onclick="openHelpModal()" class="help-btn-register">
        ❓ Help / Msaada wa Haraka
    </button>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Full Name / <i>Jina Kamili</i>:</label>
            <input type="text" name="fullName" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Phone / <i>Namba ya Simu</i>:</label>
            <input type="text" name="phoneNumber" required placeholder="07xxxxxxxx">
        </div>
        <div class="form-group">
            <label>Email / <i>Barua Pepe</i>:</label>
            <input type="email" name="email" required placeholder="example@gmail.com">
        </div>

        <!-- Uwanja wa Password wenye Jicho -->
        <div class="form-group">
            <label>Password / <i>Neno la Siri</i>:</label>
            <div class="password-container">
                <input type="password" id="registerPassword" name="password" required placeholder="••••••••">
                <span class="toggle-password-btn" id="toggleIcon" onclick="toggleRegisterPassword()">👁️</span>
            </div>
        </div>

        <div class="form-group">
            <label>Register As / <i>Aina ya Akaunti</i>:</label>
            <select name="role">
                <option value="TENANT">Tenant / Mpangaji</option>
                <option value="LANDLORD">Landlord / Mwenyenyumba</option>
            </select>
        </div>
        <button type="submit" class="btn">Register / Jisajili</button>
    </form>

    <div class="login-link">
        Una akaunti tayari? <a th:href="@{/login}">Ingia (Login)</a>
    </div>
</div>

<!-- FOOTER BRANDING: KISANGA TECHNOLOGY -->
<footer>
    <p style="margin: 0; text-transform: lowercase; color: #94a3b8; font-size: 11px;">from</p>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px;">
        <svg width="18" height="18" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
            <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
        </svg>
        <span style="font-weight: 900; font-size: 13px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
    </div>
</footer>

<!-- POP-UP YA MSAADA -->
<div id="helpModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div style="background: white; padding: 25px; border-radius: 10px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;">
        <span onclick="closeHelpModal()" style="position: absolute; right: 15px; top: 10px; font-size: 24px; font-weight: bold; cursor: pointer; color: #888;">&times;</span>

        <div style="font-size: 40px; margin-bottom: 10px;">📞</div>
        <h3 style="color: #2c3e50; margin-bottom: 10px;">Msaada wa Haraka</h3>
        <p style="font-size: 14px; color: #555; margin-bottom: 15px;">
            Wasiliana na Admin kwa msaada wa haraka kupitia namba hii:
        </p>

        <div style="background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 6px; font-size: 18px; font-weight: bold; margin-bottom: 15px;">
            📱 <a href="tel:0747466962" style="color: #0369a1; text-decoration: none;">0747466962</a>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center;">
            <a href="https://wa.me/255747466962?text=Habari%20Admin,%20ninahitaji%20msaada%20kwenye%20PangaSmart" target="_blank" style="background: #25D366; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-size: 13px; font-weight: bold;">
                💬 WhatsApp
            </a>
            <button onclick="closeHelpModal()" style="background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold;">
                Funga
            </button>
        </div>
    </div>
</div>

<script>
    function toggleRegisterPassword() {
        const passwordInput = document.getElementById("registerPassword");
        const toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.textContent = "🙈";
        } else {
            passwordInput.type = "password";
            toggleIcon.textContent = "👁️";
        }
    }

    function openHelpModal() {
        document.getElementById("helpModal").style.display = "flex";
    }
    function closeHelpModal() {
        document.getElementById("helpModal").style.display = "none";
    }
    window.onclick = function(event) {
        let modal = document.getElementById("helpModal");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>

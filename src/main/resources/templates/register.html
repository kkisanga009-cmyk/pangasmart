<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PangaSmart - Register / Jisajili</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 360px; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 13px; font-weight: bold; }
        input, select { width: 100%; padding: 9px; margin-top: 4px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; background: #27ae60; color: white; border: none; padding: 11px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="card">
    <h2 style="text-align:center;">🏠 PangaSmart</h2>
    <p style="text-align:center; font-size: 13px; color: #666;">Create Account / <i>Tengeneza Akaunti</i></p>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Full Name / <i>Jina Kamili</i>:</label>
            <input type="text" name="fullName" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Phone / <i>Namba ya Simu</i>:</label>
            <input type="text" name="phoneNumber" required placeholder="07xxxxxxxx">
        </div>
        <div class="form-group">
            <label>Email / <i>Barua Pepe</i>:</label>
            <input type="email" name="email" required placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label>Password / <i>Neno la Siri</i>:</label>
            <input type="password" name="password" required placeholder="**">
        </div>
        <div class="form-group">
            <label>Register As / <i>Aina ya Akaunti</i>:</label>
            <select name="role">
                <option value="TENANT">Tenant / Mpangaji</option>
                <option value="LANDLORD">Landlord / Mwenyenyumba</option>
            </select>
        </div>
        <button type="submit" class="btn">Register / Jisajili</button>
    </form>
</div>
</body>

    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 3px;">

            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
            <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
        </svg>
        <span style="font-weight: 900; font-size: 14px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
    </div>
</footer>
</html>

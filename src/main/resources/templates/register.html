<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PangaSmart - Register / Jisajili</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .card {
            background: white;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            margin: auto 0;
        }

        .card h2 {
            text-align: center;
            color: #2c3e50;
            font-size: 22px;
        }

        .card p {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            display: block;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #27ae60;
        }

        .btn {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #219150;
        }

        /* FOOTER STYLES */
        footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🏠 PangaSmart</h2>
    <p>Create Account / <i>Tengeneza Akaunti</i></p>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Full Name / <i>Jina Kamili</i>:</label>
            <input type="text" name="fullName" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Phone / <i>Namba ya Simu</i>:</label>
            <input type="text" name="phoneNumber" required placeholder="07xxxxxxxx">
        </div>
        <div class="form-group">
            <label>Email / <i>Barua Pepe</i>:</label>
            <input type="email" name="email" required placeholder="example@gmail.com">
        </div>
        <div class="form-group">
            <label>Password / <i>Neno la Siri</i>:</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Register As / <i>Aina ya Akaunti</i>:</label>
            <select name="role">
                <option value="TENANT">Tenant / Mpangaji</option>
                <option value="LANDLORD">Landlord / Mwenyenyumba</option>
            </select>
        </div>
        <button type="submit" class="btn">Register / Jisajili</button>
    </form>
</div>

<!-- FOOTER BRANDING: KISANGA TECHNOLOGY -->
<footer>
    <p style="margin: 0; text-transform: lowercase; color: #94a3b8; font-size: 11px;">from</p>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 2px;">
        <svg width="18" height="18" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
            <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
        </svg>
        <span style="font-weight: 900; font-size: 13px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
    </div>
</footer>

</body>
</html>

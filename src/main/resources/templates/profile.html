<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - PangaSmart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .nav-btn { color: white; text-decoration: none; padding: 6px 12px; border-radius: 5px; font-size: 13px; font-weight: bold; display: inline-block; }
        .nav-btn-admin { background-color: #8e44ad; }
        .nav-btn-admin:hover { background-color: #9b59b6; color: white; }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="/home">🏠 PangaSmart</a>

        <div class="d-flex align-items-center gap-2">
            <span class="text-white small me-2 d-none d-md-inline"
                  th:if="${currentUser != null}"
                  th:text="'Karibu, ' + ${currentUser.email} + ' (' + ${userRole} + ')'">User</span>

            <!-- KITUFE CHA MSAADA -->
            <button onclick="openHelpModal()" class="btn btn-warning btn-sm fw-bold">
                ❓ Msaada
            </button>

            <!-- DASHBOARD YA ADMIN -->
            <a th:if="${userRole == 'ADMIN' or (currentUser != null and currentUser.role == 'ADMIN') or (currentUser != null and currentUser.email != null and currentUser.email.contains('admin'))}"
               href="/admin/dashboard" class="nav-btn nav-btn-admin">📊 Admin</a>

            <a href="/home" class="btn btn-outline-light btn-sm">Nyumbani</a>
            <a href="/login" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container flex-grow-1 px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white text-center py-3 border-bottom">
                    <h4 class="mb-0 fw-bold text-dark">Taarifa Zangu (Profile)</h4>
                </div>
                <div class="card-body p-3 p-sm-4">

                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

                    <form th:action="@{/profile/update}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Jina Kamili:</label>
                            <input type="text" name="fullName" class="form-control" th:value="${user != null ? user.fullName : ''}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Barua Pepe (Email):</label>
                            <input type="email" class="form-control" th:value="${user != null ? user.email : ''}" readonly style="background-color: #e9ecef;">
                            <small class="text-muted d-block mt-1">Email haiwezi kubadilishwa.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Namba ya Simu:</label>
                            <input type="text" name="phone" class="form-control" th:value="${user != null ? user.phone : ''}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Aina ya Mtumiaji (Role):</label>
                            <input type="text" class="form-control text-uppercase" th:value="${user != null ? user.role : ''}" readonly style="background-color: #e9ecef;">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nenosiri Jipya (Acha wazi kama hutaki kubadili):</label>
                            <input type="password" name="password" class="form-control" placeholder="Weka password mpya tu">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Hifadhi Mabadiliko</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER BRANDING: KISANGA TECHNOLOGY -->
<footer style="text-align: center; margin-top: 40px; padding: 20px 0; border-top: 1px solid #e2e8f0; font-family: sans-serif;">
    <p style="margin: 0; text-transform: lowercase; color: #94a3b8; font-size: 12px;">from</p>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 3px;">
        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
            <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
        </svg>
        <span style="font-weight: 900; font-size: 14px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
    </div>
</footer>

<!-- POP-UP YA MSAADA -->
<div id="helpModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div style="background: white; padding: 25px; border-radius: 10px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;">
        <span onclick="closeHelpModal()" style="position: absolute; right: 15px; top: 10px; font-size: 24px; font-weight: bold; cursor: pointer; color: #888;">&times;</span>

        <div style="font-size: 40px; margin-bottom: 10px;">📞</div>
        <h3 style="color: #2c3e50; margin-bottom: 10px;">Msaada wa Haraka</h3>
        <p style="font-size: 14px; color: #555; margin-bottom: 15px;">
            Wasiliana na Admin kwa msaada wa haraka kupitia namba hii:
        </p>

        <div style="background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 6px; font-size: 18px; font-weight: bold; margin-bottom: 15px;">
            📱 <a href="tel:0747466962" style="color: #0369a1; text-decoration: none;">0747466962</a>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center;">
            <a href="https://wa.me/255700000000?text=Habari%20Admin,%20ninahitaji%20msaada%20kwenye%20PangaSmart" target="_blank" style="background: #25D366; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-size: 13px; font-weight: bold;">
                💬 WhatsApp
            </a>
            <button onclick="closeHelpModal()" style="background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold;">
                Funga
            </button>
        </div>
    </div>
</div>

<script>
    function openHelpModal() {
        document.getElementById("helpModal").style.display = "flex";
    }
    function closeHelpModal() {
        document.getElementById("helpModal").style.display = "none";
    }
    window.onclick = function(event) {
        let modal = document.getElementById("helpModal");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>

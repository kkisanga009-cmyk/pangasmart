<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile - PangaSmart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home">PangaSmart</a>
        <div>
            <a href="/home" class="btn btn-outline-light btn-sm me-2">Nyumbani</a>
            <a href="/login" class="btn btn-danger btn-sm">Ondoka (Logout)</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-white text-center py-3">
                    <h4 class="mb-0 fw-bold">Taarifa Zangu (Profile)</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

                    <form th:action="@{/profile/update}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Jina Kamili:</label>
                            <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Barua Pepe (Email):</label>
                            <input type="email" class="form-control" th:value="${user.email}" readonly style="background-color: #e9ecef;">
                            <small class="text-muted">Email haiwezi kubadilishwa.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Namba ya Simu:</label>
                            <input type="text" name="phone" class="form-control" th:value="${user.phone}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Aina ya Mtumiaji (Role):</label>
                            <input type="text" class="form-control text-uppercase" th:value="${user.role}" readonly style="background-color: #e9ecef;">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nenosiri Jipya (Acha wazi kama hutaki kubadili):</label>
                            <input type="password" name="password" class="form-control" placeholder="Weka password mpya tu">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold">Hifadhi Mabadiliko</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>

    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 3px;">

            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
            <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
        </svg>
        <span style="font-weight: 900; font-size: 14px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
    </div>
</footer>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PangaSmart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .forgot-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100 align-items-center justify-content-between p-3">

<div class="my-auto w-100 d-flex justify-content-center">
    <div class="card p-4 shadow-sm border-0 rounded-3 forgot-card">
        <h3 class="text-center mb-1 fw-bold text-dark">🏠 PangaSmart</h3>
        <p class="text-center text-muted small mb-3">Kusahau Nenosiri (Forgot Password)</p>

        <!-- KITUFE CHA MSAADA -->
        <button type="button" onclick="openHelpModal()" class="btn btn-warning btn-sm w-100 fw-bold mb-3">
            ❓ Help / Msaada wa Haraka
        </button>

        <!-- UJUMBE WA MAKOSA NA MAFANIKIO -->
        <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold small">Weka Email Yako:</label>
                <input type="email" name="email" class="form-control py-2" placeholder="mfano@gmail.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Endelea</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}" class="text-decoration-none small fw-bold text-primary">Rudi Kwenye Login</a>
        </div>
    </div>
</div>

<!-- FOOTER BRANDING: KISANGA TECHNOLOGY -->
<footer style="text-align: center; margin-top: 30px; padding: 15px 0; border-top: 1px solid #e2e8f0; font-family: sans-serif;" class="w-100">
    <p style="margin: 0; text-transform: lowercase; color: #94a3b8; font-size: 12px;">from</p>
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 3px;">
        <svg width="20" height="20" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
            <path d="M55 15 L35 55 H50 L45 85 L70 45 H55 L65 15 Z" fill="#f59e0b"/>
        </svg>
        <span style="font-weight: 900; font-size: 14px; color: #0f172a; letter-spacing: 1px;">
            KISANGA <span style="color: #3b82f6;">TECHNOLOGY</span>
        </span>
    </div>
</footer>

<!-- POP-UP YA MSAADA -->
<div id="helpModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <div style="background: white; padding: 25px; border-radius: 10px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;">
        <span onclick="closeHelpModal()" style="position: absolute; right: 15px; top: 10px; font-size: 24px; font-weight: bold; cursor: pointer; color: #888;">&times;</span>

        <div style="font-size: 40px; margin-bottom: 10px;">📞</div>
        <h3 style="color: #2c3e50; margin-bottom: 10px;">Msaada wa Haraka</h3>
        <p style="font-size: 14px; color: #555; margin-bottom: 15px;">
            Wasiliana na Admin kwa msaada wa haraka kupitia namba hii:
        </p>

        <div style="background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 6px; font-size: 18px; font-weight: bold; margin-bottom: 15px;">
            📱 <a href="tel:0747466962" style="color: #0369a1; text-decoration: none;">0747466962</a>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center;">
            <a href="https://wa.me/255747466962?text=Habari%20Admin,%20ninahitaji%20msaada%20kwenye%20PangaSmart" target="_blank" style="background: #25D366; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-size: 13px; font-weight: bold;">
                💬 WhatsApp
            </a>
            <button type="button" onclick="closeHelpModal()" style="background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold;">
                Funga
            </button>
        </div>
    </div>
</div>

<script>
    function openHelpModal() {
        document.getElementById("helpModal").style.display = "flex";
    }
    function closeHelpModal() {
        document.getElementById("helpModal").style.display = "none";
    }
    window.onclick = function(event) {
        let modal = document.getElementById("helpModal");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>

</body>
</html>

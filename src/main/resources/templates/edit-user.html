<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Mtumiaji - PangaSmart Admin</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #334155; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        .btn-save { background: #16a34a; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-cancel { display: block; text-align: center; margin-top: 10px; color: #64748b; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-bottom: 20px; color: #1e293b; font-size: 18px;">✏️ Rekebisha Taarifa za Mtumiaji</h2>

    <form th:action="@{/admin/users/update}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Jina Buled / Full Name:</label>
            <input type="text" th:field="*{fullName}" required />
        </div>

        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" th:field="*{email}" required />
        </div>

        <div class="form-group">
            <label>Namba ya Simu:</label>
            <input type="text" th:field="*{phone}" />
        </div>

        <div class="form-group">
            <label>Password (Neno la Siri):</label>
            <input type="text" th:field="*{password}" required />
        </div>

        <div class="form-group">
            <label>Role (Aina ya Mtumiaji):</label>
            <select th:field="*{role}">
                <option value="TENANT">TENANT</option>
                <option value="LANDLORD">LANDLORD</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>

        <button type="submit" class="btn-save">Hifadhi Mabadiliko</button>
        <a href="/admin/dashboard" class="btn-cancel">Ghairi (Cancel)</a>
    </form>
</div>

</body>
</html>
